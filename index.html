<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="form-container">
        <h2>Create Account</h2>
        <form action="#">
            
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-box">
                    <i class="fa fa-user"></i>
                    <input type="text" id="username" placeholder="Enter username" autofocus required>
                </div>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-box">
                    <i class="fa fa-envelope"></i>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-box">
                    <i class="fa fa-lock"></i>
                    <input type="password" id="password" placeholder="Min 6 characters" minlength="6" required>
                </div>
            </div>

            <div class="input-group">
                <label for="re-password">Repeat Password</label>
                <div class="input-box">
                    <i class="fa fa-shield-alt"></i>
                    <input type="password" id="re-password" placeholder="Confirm password" required>
                </div>
            </div>

            <button type="submit" class="register-btn">Register</button>

            <p class="login-link">Already have an account? <a href="#">Login here</a></p>
        </form>
    </div>

</body>
</html>
